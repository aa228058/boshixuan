name: Java Compile Test

on:
  push:
    branches:
      - broadcast-ui-build-20261102
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure temporary debug signing
        run: |
          set -euo pipefail
          mkdir -p TMessagesProj/config
          keytool -genkeypair -noprompt \
            -keystore TMessagesProj/config/release.keystore \
            -storepass android \
            -keypass android \
            -alias androidkey \
            -dname "CN=Boshixuan CI Debug, OU=Build Validation, O=Boshixuan, C=US" \
            -keyalg RSA -keysize 2048 -validity 10000
          test -s TMessagesProj/config/release.keystore

      - name: Compile universal debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.workers.max=2

      - name: Verify debug APK
        run: |
          set -euo pipefail
          APK="TMessagesProj_App/build/outputs/apk/afat/debug/app.apk"
          test -s "$APK"
          ls -lh "$APK"


      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Boshixuan-Broadcast-UI-Debug-APK
          path: TMessagesProj_App/build/outputs/apk/afat/debug/app.apk
          if-no-files-found: error
          retention-days: 7
