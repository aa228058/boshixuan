
name: Build Boshixuan APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Afat Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # 1. 获取源码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 清理磁盘
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      # 3. 配置 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      # 4. 检查 Android SDK
      - name: Configure Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK not found!"
            exit 1
          fi

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "Android SDK: $ANDROID_HOME"

      # 5. 生成临时 Keystore
      - name: Generate Keystore
        run: |
          mkdir -p TMessagesProj/config

          keytool -genkeypair -v \
            -keystore TMessagesProj/config/release.keystore \
            -alias androidkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Boshixuan"

          # 配置签名参数
          touch gradle.properties

          sed -i '/RELEASE_STORE_PASSWORD/d' gradle.properties
          sed -i '/RELEASE_KEY_ALIAS/d' gradle.properties
          sed -i '/RELEASE_KEY_PASSWORD/d' gradle.properties

          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=androidkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties

      # 6. 检查 Afat 编译任务
      - name: Check Available Build Tasks
        run: |
          chmod +x gradlew

          ./gradlew :TMessagesProj_App:tasks --all \
            | grep -i afat || {
              echo "Afat build task not found!"
              exit 1
            }

      # 7. 编译 Debug APK
      - name: Build Afat Debug APK
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            --no-daemon \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.workers.max=2

      # 8. 扫描编译输出
      - name: Inspect APK Output
        if: always()
        run: |
          echo "===== APK FILES ====="

          find . -type f -name "*.apk" \
            -not -path "./.git/*" || true

          echo "===== OUTPUT DIRECTORY ====="

          if [ -d TMessagesProj_App/build/outputs ]; then
            ls -R TMessagesProj_App/build/outputs/
          else
            echo "Outputs directory not found"
          fi

      # 9. 收集 APK
      - name: Collect APK
        if: success()
        run: |
          mkdir -p dist

          APK_DIR="TMessagesProj_App/build/outputs/apk/afat/debug"

          if [ ! -d "$APK_DIR" ]; then
            echo "APK output directory not found!"
            find . -type f -name "*.apk"
            exit 1
          fi

          mapfile -t APKS < <(
            find "$APK_DIR" -maxdepth 1 -type f -name "*.apk"
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "Expected exactly one APK."
            echo "Found: ${#APKS[@]}"
            exit 1
          fi

          cp "${APKS[0]}" dist/Boshixuan.apk

          echo "APK collected successfully:"
          ls -lh dist/

      # 10. 验证 APK 签名
      - name: Verify APK Signature
        if: success()
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found!"
            exit 1
          fi

          "$APKSIGNER" verify --verbose dist/Boshixuan.apk

      # 11. 上传 APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Boshixuan-APK
          path: dist/Boshixuan.apk
          if-no-files-found: error
          retention-days: 7

      # 12. 编译摘要
      - name: Build Summary
        if: always()
        run: |
          echo "## Boshixuan APK Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find dist -type f -exec ls -lh {} \; 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
