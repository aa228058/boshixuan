name: Java Compile Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 👇 核心：只编译 Java 代码，速度极快
      - name: Compile Java Only
        id: build_step
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:compileDebugJavaWithJavac -Dorg.gradle.jvmargs="-Xmx3g" --stacktrace 2>&1 | tee build.log

      # 👇 如果失败，直接把错误贴在网页最上面，免去手机翻日志的痛苦
      - name: Extract Error
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "### 🚨 Java 编译报错摘要：" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -i -C 2 "error:" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY
          grep -i -C 2 "FAILURE:" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail Job
        if: steps.build_step.outcome == 'failure'
        run: exit 1
