name: Java Compile Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      # 核心测试：只编译 Java 代码
      - name: Compile Java Only
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj:compileDebugJavaWithJavac -Dorg.gradle.jvmargs="-Xmx3g" --stacktrace
