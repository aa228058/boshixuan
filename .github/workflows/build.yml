name: Build Boshixuan APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 👇 关键1：在编译前强行清理服务器上没用的软件，腾出 20GB+ 空间
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          # 👇 关键2：去掉了 cache: 'gradle'，不再占用额外空间
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Boshixuan"

      - name: Build Debug APK
        id: build_step
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug 2>&1 | tee build.log

      - name: Extract Error (if failed)
        if: steps.build_step.outcome == 'failure'
        run: |
          echo "### 🚨 编译报错如下：" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          grep -i -C 2 "error:" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY
          grep -i -C 2 "FAILURE:" build.log | head -n 50 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail Job
        if: steps.build_step.outcome == 'failure'
        run: exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boshixuan-Debug-APK
          path: '**/*.apk'
