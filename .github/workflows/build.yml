name: Build Boshixuan APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure fixed release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

          mkdir -p TMessagesProj/config
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore
          test -s TMessagesProj/config/release.keystore

          sed -i '/^RELEASE_STORE_PASSWORD=/d' gradle.properties
          sed -i '/^RELEASE_KEY_ALIAS=/d' gradle.properties
          sed -i '/^RELEASE_KEY_PASSWORD=/d' gradle.properties
          {
            printf 'RELEASE_STORE_PASSWORD=%s\\n' "$RELEASE_STORE_PASSWORD"
            printf 'RELEASE_KEY_ALIAS=%s\\n' "$RELEASE_KEY_ALIAS"
            printf 'RELEASE_KEY_PASSWORD=%s\\n' "$RELEASE_KEY_PASSWORD"
          } >> gradle.properties

      - name: Build single universal Release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.workers.max=2

      - name: Verify APK and fixed signature
        run: |
          set -euo pipefail
          APK="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/Boshixuan-universal-release.apk
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          ls -lh dist/Boshixuan-universal-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boshixuan-Universal-Release-APK
          path: dist/Boshixuan-universal-release.apk
          if-no-files-found: error
