name: Build Boshixuan APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Boshixuan"

      # 👇 关键修改：去掉了 continue-on-error，如果编译失败，直接变红叉
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug --stacktrace

      # 👇 如果成功，打印出所有文件，看看它到底藏在哪
      - name: Show Build Directory
        if: always()
        run: |
          echo "Searching for APK..."
          find . -name "*.apk" -type f
          echo "Directory structure:"
          ls -R TMessagesProj_App/build/outputs/apk/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boshixuan-APK
          path: '**/*.apk'
