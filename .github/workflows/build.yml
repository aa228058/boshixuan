name: Build Boshixuan APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. 腾出 20GB+ 空间，但保留 Android SDK
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'  # 👈 开启缓存，这次几分钟就能跑完

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Boshixuan"

      - name: Build Debug APK
        id: build_step
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug 2>&1 | tee build.log

      # 2. 全盘搜刮 APK（防止路径找不到）
      - name: Collect APK
        if: always()
        run: |
          mkdir -p output_apk
          find . -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Boshixuan-APK
          path: output_apk/*.apk
