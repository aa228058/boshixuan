name: Build Boshixuan APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Generate Keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v -keystore TMessagesProj/config/release.keystore -alias androidkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Boshixuan"
          
          sed -i '/RELEASE_STORE_PASSWORD/d' gradle.properties || true
          sed -i '/RELEASE_KEY_ALIAS/d' gradle.properties || true
          sed -i '/RELEASE_KEY_PASSWORD/d' gradle.properties || true
          echo "RELEASE_STORE_PASSWORD=android" >> gradle.properties
          echo "RELEASE_KEY_ALIAS=androidkey" >> gradle.properties
          echo "RELEASE_KEY_PASSWORD=android" >> gradle.properties

      # 👇 核心：真正打包 APK
      - name: Build Afat Debug APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatDebug -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.workers.max=2

      # 👇 收集生成的 APK
      - name: Collect APK
        run: |
          mkdir -p dist
          find . -name "*.apk" -type f -exec cp {} dist/ \;
          if [ -z "$(ls -A dist/)" ]; then
            echo "❌ 错误：编译完成了，但没找到 APK！"
            exit 1
          fi
          ls -lh dist/

      # 👇 上传供你下载
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boshixuan-APK
          path: dist/*.apk
          if-no-files-found: error
