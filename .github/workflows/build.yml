name: Build Boshixuan APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Configure fixed release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required signing secret (RELEASE_* or legacy KEYSTORE_* / KEY_* name)"
              exit 1
            fi
          done

          mkdir -p TMessagesProj/config
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore
          test -s TMessagesProj/config/release.keystore
          keytool -list -keystore TMessagesProj/config/release.keystore \
            -storepass "$RELEASE_STORE_PASSWORD" -alias "$RELEASE_KEY_ALIAS" >/dev/null

          sed -i '/^RELEASE_STORE_PASSWORD=/d' gradle.properties
          sed -i '/^RELEASE_KEY_ALIAS=/d' gradle.properties
          sed -i '/^RELEASE_KEY_PASSWORD=/d' gradle.properties
          {
            printf '%s\n' "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            printf '%s\n' "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            printf '%s\n' "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> gradle.properties

      - name: Configure Telegram API credentials
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_HASH: ${{ secrets.APP_HASH }}
        run: |
          set -euo pipefail
          if ! [[ "${APP_ID:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::APP_ID secret is missing or is not a positive integer"
            exit 1
          fi
          if ! [[ "${APP_HASH:-}" =~ ^[A-Fa-f0-9]{32}$ ]]; then
            echo "::error::APP_HASH secret is missing or is not a 32-character hexadecimal API hash"
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java")
          source = path.read_text(encoding="utf-8")
          source, id_count = re.subn(
              r"public static int APP_ID = 0;",
              "public static int APP_ID = " + os.environ["APP_ID"] + ";",
              source,
          )
          source, hash_count = re.subn(
              r'public static String APP_HASH = "";',
              'public static String APP_HASH = "' + os.environ["APP_HASH"] + '";',
              source,
          )
          if id_count != 1 or hash_count != 1:
              raise SystemExit("Expected API credential placeholders were not found exactly once")
          path.write_text(source, encoding="utf-8")
          print("Telegram API credentials injected for this build (values hidden).")
          PY

      - name: Build single universal Release APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g" \
            -Dorg.gradle.workers.max=2

      - name: Verify APK and fixed signature
        run: |
          set -euo pipefail
          APK="TMessagesProj_App/build/outputs/apk/afat/release/app.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          mkdir -p dist
          cp "$APK" dist/Boshixuan-universal-release.apk
          test "$(find dist -maxdepth 1 -type f -name '*.apk' | wc -l)" -eq 1
          ls -lh dist/Boshixuan-universal-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boshixuan-Universal-Release-APK
          path: dist/Boshixuan-universal-release.apk
          if-no-files-found: error
          retention-days: 7
